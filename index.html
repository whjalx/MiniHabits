<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Mini Habits Suite</title>

    <!-- PWA Links -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <span>Mini Habits</span>
            </div>
            <ul class="nav-links">
                <li class="active" data-tab="dashboard"><i class="fa-solid fa-house"></i> Dashboard</li>
                <li data-tab="routines"><i class="fa-solid fa-stopwatch"></i> Rutinas</li>
                <li data-tab="calendar"><i class="fa-solid fa-calendar"></i> Calendario</li>
            </ul>
            <div class="actions-bottom">
                <button id="exportBtn" class="btn secondary-btn" title="Exportar Datos">
                    <i class="fa-solid fa-download"></i> Exportar
                </button>
                <button id="importBtnTrigger" class="btn secondary-btn" title="Importar Datos">
                    <i class="fa-solid fa-upload"></i> Importar
                </button>
                <input type="file" id="importInput" accept=".json" style="display: none;">
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div>
                    <h1 id="mainTitle">Mi Día</h1>
                    <p class="subtitle" id="currentDateDisplay">Fecha de hoy</p>
                </div>
                <!-- Action button dynamically hidden/shown based on tab -->
                <button id="addHabitBtn" class="btn primary-btn">
                    <i class="fa-solid fa-plus"></i> Nuevo Hábito
                </button>
            </header>

            <div id="dashboardView" class="view-section active">
                <div class="dashboard-grid">
                    <!-- Habit cards will be injected here -->
                    <div class="habits-container" id="habitsContainer">
                        <!-- Dynamic Content -->
                    </div>
                </div>
            </div>

            <div id="calendarView" class="view-section hidden">
                <div class="activity-section month-activity">
                    <div class="activity-header">
                        <h2>Resumen Mensual</h2>
                        <div class="activity-legend" id="activityLegend">
                            <!-- Legend will be dynamically generated -->
                        </div>
                    </div>
                    <div class="calendar-wrapper">
                        <div class="month-calendar-header">
                            <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
                        </div>
                        <div class="month-calendar-grid" id="activityCalendarGrid">
                            <!-- Cells will be generated here -->
                        </div>
                    </div>
                </div>
            </div>

            <div id="routinesView" class="view-section hidden">
                <div class="routines-grid">
                    <div class="routines-container" id="routinesContainer">
                        <!-- Dynamic Routines Content -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para crear/editar Hábito -->
    <div id="habitModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Hábito</h2>
                <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="habitName">Nombre del Hábito Maestro</label>
                    <input type="text" id="habitName" placeholder="Ej. Aprender a programar" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Mini Hábitos</label>
                    <div class="mini-habits-input-container">
                        <input type="text" id="miniHabitInput" placeholder="Ej. Escribir 10 líneas de código"
                            autocomplete="off">
                        <button type="button" id="addMiniHabitBtn" class="btn icon-btn"><i
                                class="fa-solid fa-plus"></i></button>
                    </div>
                    <ul id="modalMiniHabitsList" class="modal-list">
                        <!-- Dynamic Mini Habits in form -->
                    </ul>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn cancel-btn close-modal">Cancelar</button>
                <button id="saveHabitBtn" class="btn primary-btn">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal para crear/editar Rutina -->
    <div id="routineModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="routineModalTitle">Nueva Rutina</h2>
                <button class="close-routine-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="routineName">Nombre de la Rutina</label>
                    <input type="text" id="routineName" placeholder="Ej. Lectura intensiva" autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Días de la semana</label>
                    <div class="routine-checkbox-group">
                        <input type="checkbox" id="day-1" value="1"><label for="day-1">Lun</label>
                        <input type="checkbox" id="day-2" value="2"><label for="day-2">Mar</label>
                        <input type="checkbox" id="day-3" value="3"><label for="day-3">Mié</label>
                        <input type="checkbox" id="day-4" value="4"><label for="day-4">Jue</label>
                        <input type="checkbox" id="day-5" value="5"><label for="day-5">Vie</label>
                        <input type="checkbox" id="day-6" value="6"><label for="day-6">Sáb</label>
                        <input type="checkbox" id="day-0" value="0"><label for="day-0">Dom</label>
                    </div>
                </div>

                <div class="form-group time-inputs">
                    <div>
                        <label for="routineStartTime">Hora inicio (Opcional)</label>
                        <input type="time" id="routineStartTime">
                    </div>
                    <div>
                        <label for="routineEndTime">Hora fin (Opcional)</label>
                        <input type="time" id="routineEndTime">
                    </div>
                </div>

                <div class="form-group">
                    <label for="routineTimerGoal">Meta de tiempo (Cronómetro en minutos)</label>
                    <input type="number" id="routineTimerGoal" placeholder="Ej. 30" min="1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn cancel-btn close-routine-modal">Cancelar</button>
                <button id="saveRoutineBtn" class="btn primary-btn">Guardar</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>

</html>
